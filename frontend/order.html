<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bindaas Bites – Order History</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background: #f4f6f9;
    }

    .order-card {
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .order-card.pending {
      border-left: 5px solid #ffc107;
      background: #fff8e1;
    }

    .order-card.delivered {
      border-left: 5px solid #28a745;
      background: #e9f7ef;
    }

    .order-card.cancelled {
      border-left: 5px solid #dc3545;
      background: #fdecea;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="bg-white shadow-sm sticky-top mb-3">
  <div class="container d-flex justify-content-between align-items-center py-2">
    <strong id="userName">User</strong>
    <div class="d-flex gap-2">
      <a href="/menu.html" class="btn btn-outline-primary btn-sm">Menu</a>
      <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
</div>

<div class="container my-4">
  <h3 class="text-center mb-4">📦 Order History</h3>

  <!-- SUMMARY -->
  <div id="summary" class="row g-3 mb-4"></div>

  <div id="orders"></div>
</div>

<script>
const token = localStorage.getItem("token");
if (!token) location.href = "/login.html";

document.getElementById("userName").innerText =
  localStorage.getItem("userName") || "User";

fetch("/orders/history", {
  headers: { Authorization: "Bearer " + token }
})
  .then(res => res.json())
  .then(rows => {

    const ordersDiv = document.getElementById("orders");

    if (!rows.length) {
      ordersDiv.innerHTML =
        "<p class='text-center text-muted'>No orders found</p>";
      return;
    }

    // =======================
    // SUMMARY CALCULATION
    // =======================
    let totalCash = 0;
    let totalOnline = 0;
    let totalSale = 0;
    let delivered = 0;
    let pending = 0;
    let cancelled = 0;

    const uniqueOrders = {};

    rows.forEach(r => {
      if (!uniqueOrders[r.order_id]) {
        uniqueOrders[r.order_id] = true;

        if (r.status === "DELIVERED") delivered++;
        if (r.status === "PENDING") pending++;
        if (r.status === "CANCELLED") cancelled++;

        const amount = Number(r.total_amount || 0);
        totalSale += amount;

        if (r.payment_status === "PAID") {
          if (r.payment_mode === "CASH") totalCash += amount;
          if (r.payment_mode === "ONLINE") totalOnline += amount;
        }
      }
    });

    document.getElementById("summary").innerHTML = `
      <div class="col-md-4"><div class="card p-3 shadow-sm"><h6>Total Sale</h6><h4>₹${totalSale}</h4></div></div>
      <div class="col-md-4"><div class="card p-3 shadow-sm"><h6>Cash Payment</h6><h4>₹${totalCash}</h4></div></div>
      <div class="col-md-4"><div class="card p-3 shadow-sm"><h6>Online Payment</h6><h4>₹${totalOnline}</h4></div></div>
      <div class="col-md-4"><div class="card p-3 shadow-sm"><h6>Delivered Orders</h6><h4>${delivered}</h4></div></div>
      <div class="col-md-4"><div class="card p-3 shadow-sm"><h6>Pending Orders</h6><h4>${pending}</h4></div></div>
      <div class="col-md-4"><div class="card p-3 shadow-sm"><h6>Cancelled Orders</h6><h4>${cancelled}</h4></div></div>
    `;

    // =======================
    // GROUP ORDERS
    // =======================
    const orders = {};

    rows.forEach(r => {
      if (!orders[r.order_id]) {
        orders[r.order_id] = {
          id: r.order_id,
          status: r.status,
          total: r.total_amount,
          payment_status: r.payment_status,
          payment_mode: r.payment_mode,
          created_at: r.created_at,
          items: []
        };
      }

      if (r.item_name) {
        orders[r.order_id].items.push(`${r.item_name} × ${r.quantity}`);
      }
    });

    ordersDiv.innerHTML = Object.values(orders).map(o => {
      const statusClass =
        o.status === "CANCELLED" ? "cancelled" :
        o.status === "DELIVERED" ? "delivered" :
        "pending";

      const badgeClass =
        o.status === "CANCELLED" ? "bg-danger" :
        o.status === "DELIVERED" ? "bg-success" :
        "bg-warning";

      return `
        <div class="card order-card ${statusClass} p-3 mb-3">
          <div class="d-flex justify-content-between">
            <h5>Order #${o.id}</h5>
            <span class="badge ${badgeClass}">${o.status}</span>
          </div>

          <small class="text-muted">
            📅 ${new Date(o.created_at).toLocaleString()}
          </small>

          <hr>

          <div>
            ${o.items.map(i => `<div>🍽 ${i}</div>`).join("")}
          </div>

          <hr>

          <h6>Total: ₹${o.total}</h6>

          <p class="mb-1">
            💳 Payment:
            <strong>${o.payment_status || "UNPAID"}</strong>
            ${o.payment_mode ? `(${o.payment_mode})` : ""}
          </p>
        </div>
      `;
    }).join("");
  });

function logout() {
  localStorage.clear();
  location.href = "/login.html";
}
</script>

</body>
</html>
