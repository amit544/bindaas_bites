<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bindaas Bites – Login</title>

  <!-- Mobile viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background: #f4f6f9;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      border-radius: 14px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.15);
    }

    .logo {
      width: 90px;
      height: auto;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-11 col-sm-8 col-md-5 col-lg-4">
      <div class="card login-card p-4">

        <!-- LOGO -->
        <div class="text-center mb-3">
          <img
            src="/assets/logo.png"
            alt="Bindaas Bites Logo"
            class="logo"
          />
          <h5 class="mt-2">Bindaas Bites</h5>
        </div>

        <!-- LOGIN FORM -->
        <div class="mb-3">
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Username"
          />
        </div>

        <div class="mb-3">
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Password"
          />
        </div>

        <button
          class="btn btn-success w-100"
          onclick="login()"
        >
          Login
        </button>

        <p
          id="error"
          class="text-danger text-center mt-3"
          style="display:none"
        ></p>
      </div>
    </div>
  </div>
</div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem("token")) {
    window.location.href = "/menu.html";
  }

  function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorEl = document.getElementById("error");

    errorEl.style.display = "none";

    if (!username || !password) {
      errorEl.innerText = "Please enter username and password";
      errorEl.style.display = "block";
      return;
    }

    fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    })
      .then(res => res.json())
      .then(data => {
        if (data.token) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("userId", data.user.id);
          localStorage.setItem("userName", data.user.name);

          window.location.href = "/menu.html";
        } else {
          errorEl.innerText = "Invalid username or password";
          errorEl.style.display = "block";
        }
      })
      .catch(() => {
        errorEl.innerText = "Server error. Try again.";
        errorEl.style.display = "block";
      });
  }
</script>

</body>
</html>
