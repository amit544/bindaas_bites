<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: #fff;
      width: 320px;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .login-box h3 {
      margin-bottom: 20px;
      color: #333;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .login-box input:focus {
      outline: none;
      border-color: #4f46e5;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .login-box button:hover {
      background: #4338ca;
    }

    .error {
      margin-top: 10px;
      color: red;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h3>Login</h3>

    <input id="u" placeholder="Username" />
    <input id="p" type="password" placeholder="Password" />

    <button onclick="login()">Login</button>

    <div class="error" id="err"></div>
  </div>

  <script>
    function login() {
      const username = document.getElementById("u").value;
      const password = document.getElementById("p").value;

      fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      })
        .then(r => r.json())
        .then(d => {
          if (!d.token) {
            document.getElementById("err").innerText = "Invalid credentials";
            return;
          }

          localStorage.setItem("token", d.token);
          localStorage.setItem("role", d.user.role);

          location.href = "/menu.html";
        })
        .catch(() => {
          document.getElementById("err").innerText = "Server error. Try again.";
        });
    }
  </script>
</body>
</html>
