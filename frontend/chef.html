<!DOCTYPE html>
<html>
<head>
  <title>Chef Dashboard – Bindaas Bites</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    body {
      background: #f4f6f9;
    }
    .order-card {
      border-left: 6px solid #ff9800;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    .order-header {
      font-weight: bold;
      font-size: 18px;
    }
    .badge-pending {
      background: #ff9800;
    }
    .order-items {
      font-size: 14px;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">👨‍🍳 Chef Dashboard</span>
  </div>
</nav>

<div class="container my-4">
  <div class="row" id="orders"></div>
</div>

<script>
const socket = io("http://localhost:3000");

socket.on("new-order", () => {
  loadOrders();
});

function loadOrders() {
  fetch("http://localhost:3000/orders")
    .then(res => res.json())
    .then(data => {
      let html = "";

      const grouped = {};

      data.forEach(o => {
        if (!grouped[o.id]) {
          grouped[o.id] = {
            time: o.time,
            items: []
          };
        }
        grouped[o.id].items.push(`${o.name} x ${o.quantity}`);
      });

      Object.keys(grouped).forEach(orderId => {
        html += `
          <div class="col-md-6 mb-4">
            <div class="card order-card p-3">
              <div class="d-flex justify-content-between">
                <div class="order-header">
                  Order #${orderId}
                </div>
                <span class="badge badge-pending text-white">
                  PENDING
                </span>
              </div>

              <small class="text-muted">⏰ ${grouped[orderId].time}</small>

              <hr>

              <div class="order-items">
                ${grouped[orderId].items.map(i => `<div>🍽 ${i}</div>`).join("")}
              </div>

              <button class="btn btn-success mt-3"
                onclick="markDelivered(${orderId})">
                ✔ Mark Delivered
              </button>
            </div>
          </div>
        `;
      });

      document.getElementById("orders").innerHTML =
        html || "<h5 class='text-center text-muted'>No active orders</h5>";
    });
}

function markDelivered(id) {
  fetch(`http://localhost:3000/order/${id}/deliver`, {
    method: "PUT"
  }).then(() => loadOrders());
}

loadOrders();
</script>

</body>
</html>
