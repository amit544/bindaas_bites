<!DOCTYPE html>
<html>
<head>
  <title>Bindaas Bites Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light pb-5">

<div class="container my-4">
  <h2 class="text-center">🍔 Bindaas Bites Menu</h2>

  <input class="form-control my-3"
    placeholder="Search food..."
    id="search"
    onkeyup="searchMenu()"/>

  <div class="row" id="menu"></div>
</div>

<div class="fixed-bottom bg-white p-3 shadow">
  <div id="cartItems"></div>
  <strong>Total ₹<span id="total">0</span></strong>
  <button class="btn btn-success w-100 mt-2" onclick="placeOrder()">Place Order</button>
</div>

<script src="menu.js" defer></script>
</body>
</html>
