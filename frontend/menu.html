<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bindaas Bites – Menu</title>

  <!-- Mobile viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background: #f8f9fa;
      padding-bottom: 210px; /* space for sticky cart */
    }

    /* Menu card */
    .menu-card {
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      height: 100%;
    }

    /* Touch-friendly quantity buttons */
    .qty-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-text {
      min-width: 34px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
    }

    /* Sticky cart */
    .cart {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      box-shadow: 0 -6px 18px rgba(0,0,0,0.18);
      padding: 14px 16px;
      z-index: 1000;
    }

    .cart-items {
      max-height: 90px;
      overflow-y: auto;
      font-size: 14px;
    }

    /* Mobile text scaling */
    @media (max-width: 576px) {
      h2 {
        font-size: 20px;
      }

      .menu-card h5 {
        font-size: 16px;
        margin-bottom: 4px;
      }

      .menu-card h6 {
        font-size: 15px;
      }

      .cart h5 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="container my-3">
  <h2 class="text-center mb-3">🍔 Bindaas Bites Menu</h2>

  <!-- SEARCH -->
  <div class="row mb-3">
    <div class="col-12 col-md-6 mx-auto">
      <input
        id="search"
        class="form-control form-control-lg"
        placeholder="🔍 Search food or category"
        onkeyup="searchMenu()"
      />
    </div>
  </div>

  <!-- MENU GRID -->
  <div class="row g-3" id="menu"></div>
</div>

<!-- CART (STICKY BOTTOM) -->
<div class="cart">
  <h5 class="mb-1">🛒 Your Order</h5>

  <div id="cartItems" class="cart-items mb-1">
    <small>No items selected</small>
  </div>

  <div class="d-flex justify-content-between align-items-center">
    <strong>Total: ₹<span id="total">0</span></strong>

    <button
      class="btn btn-success btn-lg px-4"
      onclick="placeOrder()"
    >
      Place Order
    </button>
  </div>
</div>

<script src="menu.js" defer></script>
</body>
</html>
